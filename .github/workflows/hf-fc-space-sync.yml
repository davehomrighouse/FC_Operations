name: Sync to Hugging Face FC Operations Space

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: homrighoused/FC_Operations
          hf_token: ${{ secrets.FC_OPERATIONS_HUGGING_FACE }}
